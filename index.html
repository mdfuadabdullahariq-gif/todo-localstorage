<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>My Todo List</h1>
    <p class="subtitle">Organise your day, one task at a time.</p>

    <form id="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="Enter a new task..."
        maxlength="200"
        required
      >
      <button type="submit" id="submit-btn">Add Task</button>
    </form>

    <div class="filters">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>

    <p id="task-count">0 tasks remaining</p>
    <ul id="todo-list"></ul>

    <button type="button" id="clear-completed" class="clear-btn">
      Clear Completed
    </button>
  </main>
</body>
</html>
